name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.TASKFLOW_CLAUDE_REVIEW_SECRET }}

          # The action posts the review comment itself via track_progress,
          # rather than relying on Claude to successfully call `gh pr comment`
          # or the inline-comment MCP tool from inside the sandboxed run —
          # those calls were silently permission-denied last time
          # (is_error: false, permission_denials_count: 7, no comment posted).
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the conventions in CLAUDE.md and
            AGENTS.md at the repo root. Focus on:

            1. Security - input validation on API routes, injection risks,
               secrets, trust boundaries.
            2. Convention conformance - directory structure, the store-module
               + route-handler pattern for API resources, hydration-safety
               rules for client components, and the shared --background/
               --foreground dark-mode tokens.
            3. Correctness - logic errors, edge cases, anything that would
               break at runtime.

            Leave inline comments on specific lines where possible, and a
            short top-level summary. If the change is clean, say so briefly
            instead of inventing nitpicks.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
